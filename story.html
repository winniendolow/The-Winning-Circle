<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Story | The Winning Circle</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="container nav">

      <a
        class="logo"
        href="index.html"
      >
        The <span>Winning</span> Circle
      </a>


      <button class="menu">
        ☰
      </button>


      <nav>

        <a href="index.html">
          Home
        </a>

        <a href="stories.html">
          Stories
        </a>

        <a href="about.html">
          About
        </a>

      </nav>


      <div class="social">

        <a href="#">
          IG
        </a>

        <a href="#">
          YT
        </a>

        <a href="#">
          TT
        </a>

      </div>

    </div>

  </header>



  <!-- =========================
       STORY
  ========================== -->

  <main>

    <article
      id="article"
      class="article"
    >

      <!-- Story will load here -->

    </article>



    <!-- =========================
         NEWSLETTER
    ========================== -->

    <section class="newsletter">

      <div class="container newsletterbox">

        <div>

          <p class="eyebrow">
            STAY IN THE CIRCLE
          </p>

          <h2>
            More stories, occasionally.
          </h2>

          <p>
            Join readers who like stories with heart.
          </p>

        </div>


        <form onsubmit="subscribe(event)">

          <input
            type="email"
            placeholder="Your email address"
            required
          >

          <button class="btn">
            Subscribe
          </button>

          <small id="message"></small>

        </form>

      </div>

    </section>

  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="container footer">


      <div>

        <a
          class="logo light"
          href="index.html"
        >
          The <span>Winning</span> Circle
        </a>


        <p>
          Stories that entertain.
          Stories that inspire.
        </p>

      </div>



      <div>

        <b>
          Follow
        </b>


        <p>

          <a href="#">
            Instagram
          </a>

          ·

          <a href="#">
            YouTube
          </a>

          ·

          <a href="#">
            TikTok
          </a>

        </p>

      </div>


    </div>

  </footer>



  <!-- =========================
       LOAD STORIES
  ========================== -->

  <script src="stories.js"></script>



  <!-- =========================
       DISPLAY STORY
  ========================== -->

  <script>

    STORIES_READY.then(() => {


      /*
       * Get the story ID from the URL.
       *
       * Example:
       *
       * story.html?id=a-test-story-with-a-cover
       */

      const id =
        new URLSearchParams(location.search).get("id");



      /*
       * Find the requested story.
       */

      const story =
        STORIES.find(item => item.id === id);



      /*
       * Clean invisible Unicode characters
       * that can sometimes appear in uploaded
       * image filenames.
       */

      const cleanCover =
        story && story.cover
          ? story.cover.replace(
              /[\u200B-\u200D\uFEFF\u202A-\u202E]/g,
              ""
            )
          : "";



      /*
       * If no story was found,
       * display an error message.
       */

      if (!story) {

        document.getElementById("article").innerHTML = `

          <div class="container articlebody">

            <h1>
              Story not found
            </h1>

            <p>
              Sorry, we couldn't find this story.
            </p>

            <a
              class="read"
              href="stories.html"
            >
              ← Back to stories
            </a>

          </div>

        `;

        return;

      }



      /*
       * Update browser title.
       */

      document.title =
        story.title +
        " | The Winning Circle";



      /*
       * Create cover image.
       */

      let coverHTML = "";



      /*
       * CMS uploaded image.
       *
       * Example:
       *
       * /images/uploads/photo.jpg
       */

      if (cleanCover) {


        if (
          cleanCover.startsWith("/") ||
          cleanCover.startsWith("http")
        ) {


          coverHTML = `

            <div class="cover large image-cover">

              <img
                src="${cleanCover}"
                alt="${story.title}"
              >

              <span>
                ${story.number}
              </span>

            </div>

          `;


        }


        /*
         * Existing website covers.
         *
         * Example:
         *
         * cover-one
         */

        else {


          coverHTML = `

            <div class="cover large ${cleanCover}">

              <span>
                ${story.number}
              </span>

            </div>

          `;

        }

      }



      /*
       * Display complete story.
       */

      document.getElementById("article").innerHTML = `


        <div class="container articlehead">


          <p class="tag">
            ${story.category}
          </p>



          <h1>
            ${story.title}
          </h1>



          <p class="dek">
            ${story.excerpt}
          </p>



          <div class="byline">

            By
            <b>
              ${story.author}
            </b>

            ·

            ${story.date}

          </div>



          ${coverHTML}


        </div>



        <div class="container articlebody">


          ${story.body}



          <div class="share">

            <b>
              Share this story
            </b>


            <a href="#">
              Instagram
            </a>


            <a href="#">
              Facebook
            </a>


            <a href="#">
              WhatsApp
            </a>

          </div>



          <a
            class="read"
            href="stories.html"
          >
            ← Back to stories
          </a>


        </div>


      `;

    });

  </script>


</body>

</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stories | The Winning Circle</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head>
<body><header><div class="container nav"><a class="logo" href="index.html">The <span>Winning</span> Circle</a><button class="menu">☰</button><nav><a href="index.html">Home</a><a href="stories.html">Stories</a><a href="about.html">About</a></nav><div class="social"><a href="#">IG</a><a href="#">YT</a><a href="#">TT</a></div></div></header>
<main><section class="pagehero"><div class="container"><p class="eyebrow">THE STORY LIBRARY</p><h1>Find a story for this moment.</h1><p>Search by title, author or browse by category.</p><div class="searchrow"><input id="search" placeholder="Search stories…"><select id="category"><option value="">All categories</option><option>Real Stories</option><option>Fiction</option><option>Inspiration</option><option>Reflections</option></select></div></div></section>
<section class="section"><div class="container"><div id="results" class="cards"></div></div></section></main>
<footer><div class="container footer"><div><a class="logo light" href="index.html">The <span>Winning</span> Circle</a><p>Stories that entertain. Stories that inspire.</p></div><div><b>Follow</b><p><a href="#">Instagram</a> · <a href="#">YouTube</a> · <a href="#">TikTok</a></p></div></div></footer>
<script src="stories.js"></script><script>
const params=new URLSearchParams(location.search); document.getElementById('category').value=params.get('category')||'';
function render(){let q=document.getElementById('search').value.toLowerCase(), c=document.getElementById('category').value; let data=STORIES.filter(s=>(!c||s.category===c)&&(!q||(s.title+s.author+s.excerpt).toLowerCase().includes(q))); document.getElementById('results').innerHTML=data.length?data.map(card).join(''):'<div class="empty">No stories found. Try another search.</div>'}
function card(s){return `<article class="card"><a href="story.html?id=${s.id}"><div class="cover ${s.cover}"><span>${s.number}</span></div></a><div class="cardbody"><p class="tag">${s.category}</p><h2>${s.title}</h2><p>${s.excerpt}</p><small>By ${s.author} · ${s.date}</small><a class="read" href="story.html?id=${s.id}">Read story →</a></div></article>`}
document.getElementById('search').addEventListener('input', render);
document.getElementById('category').addEventListener('change', render);

STORIES_READY.then(render);
</script></body></html>
